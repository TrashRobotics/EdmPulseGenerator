name: "Trash EDM"
board: "ESP32 Dev Controller"

stepping:
  engine: RMT
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 2
  disable_delay_us: 0
  
start:
  must_home: false
  deactivate_parking: true
  
uart1:
  txd_pin: gpio.32
  rxd_pin: gpio.33
  baud: 115200
  mode: 8N1

axes:
  shared_stepper_disable_pin: gpio.4
  
  x:
    steps_per_mm: 6400.000
    max_rate_mm_per_min: 700
    acceleration_mm_per_sec2: 20
    max_travel_mm: 400
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 400
      feed_mm_per_min: 200
      
    
    motor0:
      limit_neg_pin: gpio.16
      pulloff_mm: 5.000
      tmc_2209:
          uart_num: 1
          addr: 0
          cs_pin: NO_PIN
          r_sense_ohms: 0.110
          run_amps: 0.800
          hold_amps: 0.500
          microsteps: 128
          stallguard: 0
          stallguard_debug: false
          toff_disable: 0
          toff_stealthchop: 5
          toff_coolstep: 3
          run_mode: StealthChop
          homing_mode: StealthChop
          homing_amps: 0.50
          use_enable: false
          direction_pin: gpio.13
          step_pin: gpio.12
          disable_pin: NO_PIN
        
    motor1:
      limit_neg_pin: gpio.17
      pulloff_mm: 5.000
      tmc_2209:
          uart_num: 1
          addr: 1
          cs_pin: NO_PIN
          r_sense_ohms: 0.110
          run_amps: 0.800
          hold_amps: 0.500
          microsteps: 128
          stallguard: 0
          stallguard_debug: false
          toff_disable: 0
          toff_stealthchop: 5
          toff_coolstep: 3
          run_mode: StealthChop
          homing_mode: StealthChop
          homing_amps: 0.50
          use_enable: false
          direction_pin: gpio.14
          step_pin: gpio.27
          disable_pin: NO_PIN      

  y:
    steps_per_mm: 6400.000
    max_rate_mm_per_min: 700
    acceleration_mm_per_sec2: 40
    max_travel_mm: 300
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 400
      feed_mm_per_min: 200

    motor0:
      limit_neg_pin: gpio.21
      tmc_2209:
          uart_num: 1
          addr: 2
          cs_pin: NO_PIN
          r_sense_ohms: 0.110
          run_amps: 0.800
          hold_amps: 0.500
          microsteps: 128
          stallguard: 0
          stallguard_debug: false
          toff_disable: 0
          toff_stealthchop: 5
          toff_coolstep: 3
          run_mode: StealthChop
          homing_mode: StealthChop
          homing_amps: 0.50
          use_enable: false
          direction_pin: gpio.26
          step_pin: gpio.25
          disable_pin: NO_PIN      
    motor1:
      null_motor:


spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN

coolant:
  flood_pin: NO_PIN
  mist_pin:  NO_PIN

probe:
  pin: NO_PIN

control:
  feed_hold_pin: gpio.15
  cycle_start_pin: gpio.22